daemon off;
error_log logs/error.log debug;
pid logs/nginx.pid;
worker_processes 2;
events { worker_connections 128; }
http {
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;
    keepalive_timeout 0;
    access_log logs/access.log;
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    js_engine qjs;
    js_import payment from subrequest.js;
    js_set $private_xpay_token payment.token;
    wechatpay_allow_insecure_http on;
    wechatpay_xpay_live_key_file fixtures/live.key;
    wechatpay_xpay_sandbox_key_file fixtures/sandbox.key;
    wechatpay_xpay_access_token $private_xpay_token;
    wechatpay_xpay_auth appkey;
    server {
        listen 8888;
        location = /call { js_content payment.query; }
        location = /audit { internal; js_content payment.audit; }
        location = /xpay/query_order {
            wechatpay_audit_request /audit;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/start_upload_goods {
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/sandbox {
            wechatpay_xpay_env 1;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/spill {
            client_body_buffer_size 1k;
            client_body_in_file_only clean;
            wechatpay_audit_request /audit;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/notify_provide_goods {
            wechatpay_xpay_auth token;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/no_token {
            wechatpay_xpay_access_token "";
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/bounded {
            wechatpay_body_max_size 64;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19001;
        }
        location = /xpay/raw {
            wechatpay_body_max_size 256;
            wechatpay_xpay_proxy_pass http://127.0.0.1:19005;
        }
        location = /xpay/tls {
            wechatpay_xpay_proxy_pass https://127.0.0.1:19005;
        }
        location = / { return 200 ok; }
    }
}
